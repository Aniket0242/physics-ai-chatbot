<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics AI Assistant</title>
    <script>
        MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f172a; color: #e2e8f0; height: 100vh; display: flex; }

        /* SIDEBAR */
        .sidebar {
            width: 260px;
            background: #1e293b;
            border-right: 1px solid #334155;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .sidebar-header h3 { font-size: 14px; color: #94a3b8; }
        .new-chat-btn {
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 12px;
        }
        .chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }
        .chat-item {
            padding: 10px 12px;
            margin-bottom: 4px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #cbd5e1;
        }
        .chat-item:hover { background: #334155; }
        .chat-item.active { background: #334155; border: 1px solid #3b82f6; }
        .chat-item .delete-btn {
            background: none;
            border: none;
            color: #64748b;
            cursor: pointer;
            font-size: 14px;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .chat-item .delete-btn:hover { color: #ef4444; background: #1e293b; }
        .sidebar-footer {
            padding: 12px 16px;
            border-top: 1px solid #334155;
            font-size: 11px;
            color: #64748b;
        }

        /* MAIN CHAT AREA */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }
        .header {
            background: #1e293b;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #334155;
        }
        .logo { font-size: 28px; }
        .header h1 { font-size: 20px; font-weight: 600; color: #f1f5f9; }
        .header span { font-size: 12px; color: #94a3b8; margin-left: auto; }
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .message {
            display: flex;
            gap: 10px;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .message.user { justify-content: flex-end; }
        .avatar {
            width: 36px; height: 36px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; flex-shrink: 0;
        }
        .message.bot .avatar { background: #3b82f6; }
        .message.user .avatar { background: #10b981; order: 2; }
        .bubble {
            max-width: 75%; padding: 14px 18px; border-radius: 16px;
            line-height: 1.6; word-wrap: break-word;
        }
        .message.bot .bubble { background: #1e293b; border: 1px solid #334155; border-top-left-radius: 4px; }
        .message.user .bubble { background: #3b82f6; color: white; border-top-right-radius: 4px; }
        .bubble h2 { font-size: 16px; margin: 12px 0 6px; color: #60a5fa; }
        .bubble h2:first-child { margin-top: 0; }
        .typing .bubble { background: #1e293b; border: 1px solid #334155; padding: 12px 18px; }
        .typing-dots { display: flex; gap: 4px; }
        .typing-dots span {
            width: 8px; height: 8px; border-radius: 50%;
            background: #64748b; animation: bounce 1.4s infinite;
        }
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-8px); } }
        .input-area { background: #1e293b; padding: 16px 24px; border-top: 1px solid #334155; }
        .mode-buttons { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
        .mode-btn {
            padding: 6px 14px; border: 1px solid #475569; border-radius: 20px;
            background: transparent; color: #94a3b8; cursor: pointer; font-size: 13px;
            transition: all 0.2s;
        }
        .mode-btn:hover { border-color: #60a5fa; color: #60a5fa; }
        .mode-btn.active { background: #3b82f6; border-color: #3b82f6; color: white; }
        .input-row { display: flex; gap: 10px; align-items: flex-end; }
        .input-row textarea {
            flex: 1; background: #0f172a; border: 1px solid #334155; border-radius: 12px;
            padding: 12px 16px; color: #e2e8f0; font-size: 15px; resize: none;
            font-family: inherit; min-height: 44px; max-height: 120px; outline: none;
        }
        .input-row textarea:focus { border-color: #3b82f6; }
        .send-btn {
            width: 44px; height: 44px; border-radius: 50%; background: #3b82f6;
            border: none; color: white; font-size: 20px; cursor: pointer; flex-shrink: 0;
        }
        .send-btn:hover { background: #2563eb; }
        .send-btn:disabled { background: #334155; cursor: not-allowed; }
        .chat-container::-webkit-scrollbar { width: 6px; }
        .chat-container::-webkit-scrollbar-track { background: transparent; }
        .chat-container::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        .empty-state { text-align: center; color: #64748b; margin-top: 60px; }
        .empty-state .icon { font-size: 64px; margin-bottom: 16px; }
        .empty-state h3 { font-size: 20px; margin-bottom: 8px; color: #94a3b8; }
        .suggestions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 20px; }
        .suggestion-chip {
            padding: 8px 16px; background: #1e293b; border: 1px solid #334155;
            border-radius: 20px; color: #94a3b8; cursor: pointer; font-size: 13px;
        }
        .suggestion-chip:hover { border-color: #60a5fa; color: #60a5fa; }
    </style>
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <div class="sidebar-header">
        <h3>📚 Conversations</h3>
        <button class="new-chat-btn" onclick="startNewChat()">＋ New</button>
    </div>
    <div class="chat-list" id="chatList"></div>
    <div class="sidebar-footer">Physics AI Assistant v1.0</div>
</div>

<!-- MAIN CHAT -->
<div class="main">
    <div class="header">
        <div class="logo">🧠</div>
        <h1>Physics AI Assistant</h1>
        <span>Class 12 | NEET · JEE · CBSE</span>
    </div>

    <div class="chat-container" id="chatContainer">
        <div class="empty-state" id="emptyState">
            <div class="icon">⚡</div>
            <h3>Your Physics Tutor is Ready</h3>
            <p>Ask any physics question, solve numericals, or get derivations</p>
            <div class="suggestions">
                <div class="suggestion-chip" onclick="sendSuggestion('What is Ohm\'s Law?')">What is Ohm's Law?</div>
                <div class="suggestion-chip" onclick="sendSuggestion('Derive the formula for kinetic energy')">Derive KE formula</div>
                <div class="suggestion-chip" onclick="sendSuggestion('A car accelerates from rest at 2 m/s² for 10 seconds. Find distance covered.')">Solve numerical</div>
                <div class="suggestion-chip" onclick="sendSuggestion('Explain Faraday\'s Law of electromagnetic induction')">Faraday's Law</div>
            </div>
        </div>
    </div>

    <div class="input-area">
        <div class="mode-buttons">
    <button class="mode-btn" onclick="setMode(this, null)">💬 General</button>
    <button class="mode-btn" onclick="setMode(this, 'solve')">🔢 Solve</button>
    <button class="mode-btn" onclick="setMode(this, 'derive')">📐 Derive</button>
    <button class="mode-btn" onclick="setMode(this, 'explain')">📚 Explain</button>
    <button class="mode-btn" id="bankToggle" onclick="toggleBank()">📚 My Bank</button>
</div>
        <div class="input-row">
            <textarea id="questionInput" placeholder="Ask your physics question here..." rows="1" onkeydown="handleKeyDown(event)" oninput="autoResize(this)"></textarea>
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
        </div>
    </div>
</div>

<script>
    const API_BASE = "http://127.0.0.1:8000";
    let currentMode = null;
let useBank = false;

function toggleBank() {
    useBank = !useBank;
    const btn = document.getElementById('bankToggle');
    if (useBank) {
        btn.classList.add('active');
    } else {
        btn.classList.remove('active');
    }
}
    const STORAGE_KEY = 'physicsChatApp';

    // Data structure: { chats: [ { id, title, messages: [ {text, type, timestamp} ] } ], currentChatId: id }
    function getAppData() {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : { chats: [], currentChatId: null };
    }

    function saveAppData(data) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function generateId() {
        return Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
    }

    // Get current chat object
    function getCurrentChat() {
        const appData = getAppData();
        if (!appData.currentChatId) return null;
        return appData.chats.find(c => c.id === appData.currentChatId) || null;
    }

    // Set current chat and save
    function setCurrentChat(chatId) {
        const appData = getAppData();
        appData.currentChatId = chatId;
        saveAppData(appData);
    }

    function startNewChat() {
        const appData = getAppData();
        const newChat = {
            id: generateId(),
            title: 'New Chat',
            messages: []
        };
        appData.chats.unshift(newChat);
        appData.currentChatId = newChat.id;
        saveAppData(appData);
        renderAll();
    }

    function deleteChat(chatId) {
        const appData = getAppData();
        appData.chats = appData.chats.filter(c => c.id !== chatId);
        if (appData.currentChatId === chatId) {
            appData.currentChatId = appData.chats.length > 0 ? appData.chats[0].id : null;
        }
        saveAppData(appData);
        renderAll();
    }

    function selectChat(chatId) {
        setCurrentChat(chatId);
        renderAll();
    }

    // Add a message to the current chat
    function addMessageToCurrentChat(text, type) {
        const appData = getAppData();
        const chat = appData.chats.find(c => c.id === appData.currentChatId);
        if (!chat) return;
        chat.messages.push({
            text: text,
            type: type,
            timestamp: new Date().toISOString()
        });
        // Update title based on first user message
        if (type === 'user' && chat.messages.filter(m => m.type === 'user').length === 1) {
            chat.title = text.length > 40 ? text.substring(0, 40) + '...' : text;
        }
        saveAppData(appData);
    }

    // Render sidebar list
    function renderSidebar() {
        const appData = getAppData();
        const chatList = document.getElementById('chatList');
        chatList.innerHTML = '';
        appData.chats.forEach(chat => {
            const div = document.createElement('div');
            div.className = 'chat-item' + (chat.id === appData.currentChatId ? ' active' : '');
            div.innerHTML = `
                <span style="flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" onclick="selectChat('${chat.id}')">${chat.title}</span>
                <button class="delete-btn" onclick="event.stopPropagation(); deleteChat('${chat.id}')">🗑</button>
            `;
            chatList.appendChild(div);
        });
    }

    // Render main chat area with current chat messages
    function renderChat() {
        const container = document.getElementById('chatContainer');
        container.innerHTML = '';
        const chat = getCurrentChat();
        if (!chat || chat.messages.length === 0) {
            container.innerHTML = `
                <div class="empty-state" id="emptyState">
                    <div class="icon">⚡</div>
                    <h3>Your Physics Tutor is Ready</h3>
                    <p>Ask any physics question, solve numericals, or get derivations</p>
                    <div class="suggestions">
                        <div class="suggestion-chip" onclick="sendSuggestion('What is Ohm\\'s Law?')">What is Ohm's Law?</div>
                        <div class="suggestion-chip" onclick="sendSuggestion('Derive the formula for kinetic energy')">Derive KE formula</div>
                        <div class="suggestion-chip" onclick="sendSuggestion('A car accelerates from rest at 2 m/s² for 10 seconds. Find distance covered.')">Solve numerical</div>
                        <div class="suggestion-chip" onclick="sendSuggestion('Explain Faraday\\'s Law of electromagnetic induction')">Faraday's Law</div>
                    </div>
                </div>
            `;
            return;
        }
        chat.messages.forEach(msg => {
            addMessageToDOM(msg.text, msg.type, new Date(msg.timestamp));
        });
        container.scrollTop = container.scrollHeight;
        // Trigger MathJax
        if (window.MathJax) {
            MathJax.typesetPromise([container]);
        }
    }

    function renderAll() {
        renderSidebar();
        renderChat();
    }

    // ----- Message sending (unchanged) -----
    async function sendMessage() {
        const input = document.getElementById('questionInput');
        const question = input.value.trim();
        if (!question) return;

        // If no current chat, create one
        let appData = getAppData();
        if (!appData.currentChatId || !appData.chats.find(c => c.id === appData.currentChatId)) {
            startNewChat();
            appData = getAppData(); // refresh after creating
        }

        const sendBtn = document.getElementById('sendBtn');
        sendBtn.disabled = true;
        input.value = '';
        input.style.height = 'auto';

        const emptyState = document.getElementById('emptyState');
        if (emptyState) emptyState.remove();

        // Add user message
        addMessageToCurrentChat(question, 'user');
        renderChat(); // re-render to show user message immediately
        renderSidebar(); // update title in sidebar

        const typingMsg = addTypingIndicator();

        try {
            const response = await fetch(`${API_BASE}/ask`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question, language: 'en', mode: currentMode,use_bank: useBank})
            });
            const data = await response.json();
            typingMsg.remove();

            if (response.ok && data.status === 'success') {
                addMessageToCurrentChat(data.answer, 'bot');
            } else {
                addMessageToCurrentChat('Error: ' + (data.detail || 'Something went wrong'), 'bot');
            }
        } catch (error) {
            typingMsg.remove();
            addMessageToCurrentChat('Connection error. Is the server running?', 'bot');
        }

        sendBtn.disabled = false;
        input.focus();
        renderChat();
        renderSidebar();
    }

    // DOM rendering helper (unchanged)
    function addMessageToDOM(text, type, timestamp) {
        const container = document.getElementById('chatContainer');
        const msgDiv = document.createElement('div');
        msgDiv.className = 'message ' + type;

        const avatar = type === 'user' ? '👤' : '🤖';
        const avatarBg = type === 'user' ? '#10b981' : '#3b82f6';

        let html = text;
        if (type === 'bot') {
            html = html
                .replace(/^## (.*$)/gm, '<h2>$1</h2>')
                .replace(/^### (.*$)/gm, '<h3>$1</h3>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\n\n/g, '<br><br>')
                .replace(/\n/g, '<br>');
        }

        const timeStr = timestamp ? '<div style="font-size:10px; color:#64748b; margin-top:4px;">' + new Date(timestamp).toLocaleTimeString() + '</div>' : '';

        msgDiv.innerHTML = `
            <div class="avatar" style="background: ${avatarBg}">${avatar}</div>
            <div class="bubble">${html}${timeStr}</div>
        `;
        container.appendChild(msgDiv);
        container.scrollTop = container.scrollHeight;
    }

    function addTypingIndicator() {
        const container = document.getElementById('chatContainer');
        const msgDiv = document.createElement('div');
        msgDiv.className = 'message bot typing';
        msgDiv.innerHTML = `
            <div class="avatar" style="background: #3b82f6">🤖</div>
            <div class="bubble">
                <div class="typing-dots">
                    <span></span><span></span><span></span>
                </div>
            </div>
        `;
        container.appendChild(msgDiv);
        container.scrollTop = container.scrollHeight;
        return msgDiv;
    }

    // Mode & helpers (unchanged)
    function setMode(btn, mode) {
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentMode = mode;
    }
    function autoResize(textarea) {
        textarea.style.height = 'auto';
        textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
    }
    function handleKeyDown(event) {
        if (event.key === 'Enter' && !event.shiftKey) {
            event.preventDefault();
            sendMessage();
        }
    }
    function sendSuggestion(text) {
        document.getElementById('questionInput').value = text;
        sendMessage();
    }

    // Initial load
    renderAll();
    // If no chats exist, auto-create one
    if (!getCurrentChat()) {
        startNewChat();
    }
    document.getElementById('questionInput').focus();
</script>

</body>
</html>
