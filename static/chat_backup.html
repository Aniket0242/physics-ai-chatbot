<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics AI Assistant</title>
    <script>
        MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f172a; color: #e2e8f0; height: 100vh; display: flex; flex-direction: column; }
        .header { background: #1e293b; padding: 16px 24px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #334155; }
        .logo { font-size: 28px; }
        .header h1 { font-size: 20px; font-weight: 600; color: #f1f5f9; }
        .header span { font-size: 12px; color: #94a3b8; margin-left: auto; }
        .chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
        .message { display: flex; gap: 10px; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .message.user { justify-content: flex-end; }
        .avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
        .message.bot .avatar { background: #3b82f6; }
        .message.user .avatar { background: #10b981; order: 2; }
        .bubble { max-width: 75%; padding: 14px 18px; border-radius: 16px; line-height: 1.6; word-wrap: break-word; }
        .message.bot .bubble { background: #1e293b; border: 1px solid #334155; border-top-left-radius: 4px; }
        .message.user .bubble { background: #3b82f6; color: white; border-top-right-radius: 4px; }
        .bubble h2 { font-size: 16px; margin: 12px 0 6px; color: #60a5fa; }
        .bubble h2:first-child { margin-top: 0; }
        .typing .bubble { background: #1e293b; border: 1px solid #334155; padding: 12px 18px; }
        .typing-dots { display: flex; gap: 4px; }
        .typing-dots span { width: 8px; height: 8px; border-radius: 50%; background: #64748b; animation: bounce 1.4s infinite; }
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-8px); } }
        .input-area { background: #1e293b; padding: 16px 24px; border-top: 1px solid #334155; }
        .mode-buttons { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
        .mode-btn { padding: 6px 14px; border: 1px solid #475569; border-radius: 20px; background: transparent; color: #94a3b8; cursor: pointer; font-size: 13px; transition: all 0.2s; }
        .mode-btn:hover { border-color: #60a5fa; color: #60a5fa; }
        .mode-btn.active { background: #3b82f6; border-color: #3b82f6; color: white; }
        .input-row { display: flex; gap: 10px; align-items: flex-end; }
        .input-row textarea { flex: 1; background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 12px 16px; color: #e2e8f0; font-size: 15px; resize: none; font-family: inherit; min-height: 44px; max-height: 120px; outline: none; }
        .input-row textarea:focus { border-color: #3b82f6; }
        .input-row textarea::placeholder { color: #64748b; }
        .send-btn { width: 44px; height: 44px; border-radius: 50%; background: #3b82f6; border: none; color: white; font-size: 20px; cursor: pointer; flex-shrink: 0; }
        .send-btn:hover { background: #2563eb; }
        .send-btn:disabled { background: #334155; cursor: not-allowed; }
        .chat-container::-webkit-scrollbar { width: 6px; }
        .chat-container::-webkit-scrollbar-track { background: transparent; }
        .chat-container::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        .empty-state { text-align: center; color: #64748b; margin-top: 60px; }
        .empty-state .icon { font-size: 64px; margin-bottom: 16px; }
        .empty-state h3 { font-size: 20px; margin-bottom: 8px; color: #94a3b8; }
        .suggestions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 20px; }
        .suggestion-chip { padding: 8px 16px; background: #1e293b; border: 1px solid #334155; border-radius: 20px; color: #94a3b8; cursor: pointer; font-size: 13px; }
        .suggestion-chip:hover { border-color: #60a5fa; color: #60a5fa; }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">🧠</div>
        <h1>Physics AI Assistant</h1>
        <span>Class 12 | NEET · JEE · CBSE</span>
    </div>

    <div class="chat-container" id="chatContainer">
        <div class="empty-state" id="emptyState">
            <div class="icon">⚡</div>
            <h3>Your Physics Tutor is Ready</h3>
            <p>Ask any physics question, solve numericals, or get derivations</p>
            <div class="suggestions">
                <div class="suggestion-chip" onclick="sendSuggestion('What is Ohm\'s Law?')">What is Ohm's Law?</div>
                <div class="suggestion-chip" onclick="sendSuggestion('Derive the formula for kinetic energy')">Derive KE formula</div>
                <div class="suggestion-chip" onclick="sendSuggestion('A car accelerates from rest at 2 m/s² for 10 seconds. Find distance covered.')">Solve numerical</div>
                <div class="suggestion-chip" onclick="sendSuggestion('Explain Faraday\'s Law of electromagnetic induction')">Faraday's Law</div>
            </div>
        </div>
    </div>

    <div class="input-area">
        <div class="mode-buttons">
            <button class="mode-btn" onclick="setMode(this, null)">💬 General</button>
            <button class="mode-btn" onclick="setMode(this, 'solve')">🔢 Solve</button>
            <button class="mode-btn" onclick="setMode(this, 'derive')">📐 Derive</button>
            <button class="mode-btn" onclick="setMode(this, 'explain')">📚 Explain</button>
        </div>
        <div class="input-row">
            <textarea id="questionInput" placeholder="Ask your physics question here..." rows="1" onkeydown="handleKeyDown(event)" oninput="autoResize(this)"></textarea>
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
        </div>
    </div>

    <script>
        const API_BASE = "http://127.0.0.1:8000";
        let currentMode = null;

        function setMode(btn, mode) {
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentMode = mode;
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
        }

        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function sendSuggestion(text) {
            document.getElementById('questionInput').value = text;
            sendMessage();
        }

        async function sendMessage() {
            const input = document.getElementById('questionInput');
            const question = input.value.trim();
            if (!question) return;

            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;
            input.value = '';
            input.style.height = 'auto';

            const emptyState = document.getElementById('emptyState');
            if (emptyState) emptyState.remove();

            addMessage(question, 'user');

            const typingMsg = addTypingIndicator();

            try {
                const response = await fetch(`${API_BASE}/ask`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question, language: 'en', mode: currentMode })
                });
                const data = await response.json();
                typingMsg.remove();

                if (response.ok && data.status === 'success') {
                    addMessage(data.answer, 'bot');
                } else {
                    addMessage('Error: ' + (data.detail || 'Something went wrong'), 'bot');
                }
            } catch (error) {
                typingMsg.remove();
                addMessage('Connection error. Is the server running?', 'bot');
            }

            sendBtn.disabled = false;
            input.focus();

            // Re-render MathJax
            const container = document.getElementById('chatContainer');
            if (window.MathJax) {
                MathJax.typesetPromise([container]);
            }
            container.scrollTop = container.scrollHeight;
        }

        function addMessage(text, type) {
            const container = document.getElementById('chatContainer');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${type}`;

            const avatar = type === 'user' ? '👤' : '🤖';
            const avatarBg = type === 'user' ? '#10b981' : '#3b82f6';

            let html = text;
            if (type === 'bot') {
                // Basic markdown → HTML (headings, bold, line breaks)
                html = html
                    .replace(/^## (.*$)/gm, '<h2>$1</h2>')
                    .replace(/^### (.*$)/gm, '<h3>$1</h3>')
                    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                    .replace(/\n\n/g, '<br><br>')
                    .replace(/\n/g, '<br>');
            }

            msgDiv.innerHTML = `
                <div class="avatar" style="background: ${avatarBg}">${avatar}</div>
                <div class="bubble">${html}</div>
            `;

            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }

        function addTypingIndicator() {
            const container = document.getElementById('chatContainer');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message bot typing';
            msgDiv.innerHTML = `
                <div class="avatar" style="background: #3b82f6">🤖</div>
                <div class="bubble">
                    <div class="typing-dots">
                        <span></span><span></span><span></span>
                    </div>
                </div>
            `;
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
            return msgDiv;
        }

        document.getElementById('questionInput').focus();
    </script>
</body>
</html>
