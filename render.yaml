services:
  - type: web
    name: physics-ai-chatbot
    runtime: python311
    buildCommand: pip install --only-binary :all: -r requirements.txt
    startCommand: uvicorn app.api.main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        sync: false
      - key: AI_MODEL
        sync: false
      - key: CARGO_HOME
        value: /tmp